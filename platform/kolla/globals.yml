---
# Kolla-Ansible 2026.1 (Gazpacho). Only values that differ from the defaults.
kolla_base_distro: "ubuntu"

network_interface: "mgmt0"
neutron_external_interface: "ext0"
neutron_plugin_agent: "openvswitch"

# Single controller, no HA: APIs listen on ctl1 directly.
enable_haproxy: "no"
enable_proxysql: "no"
kolla_internal_vip_address: "10.20.0.11"

# RAM budget: fewer API workers, no services the demo does not use.
openstack_service_workers: "2"
enable_fluentd: "no"
enable_heat: "no"
enable_cinder: "yes"
enable_cinder_backup: "no"

nova_compute_virt_type: "kvm"

# External Ceph (cephadm, see deploy.sh). Nova uses the cinder key.
glance_backend_ceph: "yes"
cinder_backend_ceph: "yes"
nova_backend_ceph: "yes"

# Department DNS. bind9 answers department zones and forwards everything else (recursion
# is limited to BIND's default "localnets", which covers the provider network).
enable_designate: "yes"
designate_ns_record: ["ns1.ironcloud.lab"]
neutron_dns_domain: "ironcloud.lab."
designate_recursion: "yes"
designate_forwarders_addresses: "1.1.1.1; 8.8.8.8"
designate_api_workers: "1"
designate_central_workers: "1"
designate_worker_workers: "1"
designate_producer_workers: "1"
designate_mdns_workers: "1"
designate_backend_bind9_workers: "1"
