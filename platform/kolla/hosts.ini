# Top-level groups. deploy.sh appends the service groups from Kolla's shipped multinode inventory.
[control]
# Designate bind9 also listens on the shared-services address (svc0).
ctl1 dns_interface=svc0

[network]
ctl1

[compute]
cmp1
cmp2

[monitoring]
ctl1

[storage]
ctl1

[deployment]
localhost ansible_connection=local

[all:vars]
ansible_user=ubuntu
ansible_become=true
